<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Dashboard Menu</title>
<link rel="stylesheet" href="styles.css">
<style>
  .menu-inner { padding: 22px 39px 20px; }
  .menu-list { margin-top: 4px; }
  .menu-item { display: flex; align-items: center; gap: 16px; height: 60px; border-bottom: 1px solid var(--color-divider); }
  .menu-item .mi-ic { width: 40px; height: 40px; border-radius: var(--radius-xl); background: var(--color-bg-tint); display: flex; align-items: center; justify-content: center; }
  .menu-item .mi-lbl { flex: 1; font-family: var(--font-family); font-weight: 700; font-size: 14px; line-height: 17px; color: var(--color-fg-strong); }
  .menu-item .mi-sub { font-family: var(--font-family-body); font-weight: 400; font-size: 12px; line-height: 14px; color: var(--color-muted); margin-top: 2px; }
  .menu-item:active { background: var(--color-bg); }
</style>
</head>
<body>
<div class="screen" data-od-id="dashboard-menu-screen">
  <header class="head-b" data-od-id="menu-header">
    <div class="head-left">
      <a class="icon-btn" href="dashboard.html" aria-label="Back" data-od-id="menu-back">
        <svg width="18" height="15" viewBox="0 0 18 15" fill="none"><path d="M7 1L1 7.5 7 14M1 7.5h16" stroke="#181461" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="head-title" data-od-id="menu-title">Menu</span>
    </div>
    <a class="icon-btn" href="dashboard-menu.html" aria-label="Profile" data-od-id="menu-user">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#181461" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </header>

  <div class="scroll">
    <div class="menu-inner">
      <div class="section-label" data-od-id="menu-section-label">Menu</div>
      <div class="menu-list" data-od-id="menu-list">
        <a class="menu-item" href="dashboard.html" data-od-id="menu-item-overview">
          <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg></span>
          <span><span class="mi-lbl">Overview</span><span class="mi-sub">Dashboard summary</span></span>
        </a>
        <a class="menu-item" href="dashboard-stats.html" data-od-id="menu-item-statistics">
          <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
          <span><span class="mi-lbl">Statistics</span><span class="mi-sub">Income &amp; expenses</span></span>
        </a>
        <a class="menu-item" href="money-management.html" data-od-id="menu-item-money">
          <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10.5v3M18 10.5v3"/></svg></span>
          <span><span class="mi-lbl">Money Management</span><span class="mi-sub">Transactions &amp; categories</span></span>
        </a>
        <a class="menu-item" href="time-management.html" data-od-id="menu-item-time">
          <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span><span class="mi-lbl">Time Management</span><span class="mi-sub">Calendar &amp; appointments</span></span>
        </a>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-od-id="tabbar">
    <div class="tabs-side">
      <a class="tab active" href="dashboard.html" data-od-id="tab-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="tab" href="money-management.html" data-od-id="tab-money">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10.5v3M18 10.5v3"/></svg>
        <span>Money</span>
      </a>
    </div>
    <div class="fab-slot"></div>
    <div class="tabs-side">
      <a class="tab" href="time-management.html" data-od-id="tab-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Time</span>
      </a>
    </div>
    <a class="fab" href="money-management-3.html" aria-label="Add" data-od-id="fab">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 0V20M0 10H20" stroke="#fff" stroke-width="3"/></svg>
    </a>
  </nav>
</div>
</body>
</html>
