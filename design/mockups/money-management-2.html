<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Money Management 2</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mm2-inner { padding: 22px 40px 20px; }
  .search-wrap { margin-bottom: 24px; }
  .tx-list { }
</style>
</head>
<body>
<div class="screen" data-od-id="money-2-screen">
  <header class="head-b" data-od-id="money-2-header">
    <div class="head-left">
      <a class="icon-btn" href="money-management.html" aria-label="Back" data-od-id="money-2-back">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1L2 9l7.5 8" stroke="#181461" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="head-title" data-od-id="money-2-title">Transactions</span>
    </div>
    <a class="icon-btn" href="dashboard-menu.html" aria-label="Profile" data-od-id="money-2-user">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#181461" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </header>

  <div class="scroll">
    <div class="mm2-inner">
      <div class="search-wrap" data-od-id="money-2-search">
        <div class="field">
          <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
          <input type="text" placeholder="Search">
        </div>
        <div class="field" style="margin-top:20px;">
          <span class="field-icon"><svg width="15" height="16" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
          <select aria-label="Category filter">
            <option value="" disabled selected>All categories</option>
            <option>Income</option>
            <option>Groceries</option>
            <option>Housing</option>
            <option>Food</option>
            <option>Transport</option>
          </select>
        </div>
      </div>

      <div class="section-label" data-od-id="money-2-list-title">This month</div>

      <div class="tx-list" data-od-id="money-2-tx-list">
        <a class="tx-row" href="money-management.html" data-od-id="tx2-row-salary">
          <div class="tx-ill"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#179F2F" stroke-width="1.8"><path d="M12 3v18M7 7l5-4 5 4M7 17l5 4 5-4"/></svg></div>
          <div class="tx-col"><div class="tx-cat">Income</div><div class="tx-desc">Monthly payroll deposit</div><div class="tx-date">10 Apr</div></div>
          <div class="tx-amt">+2,450.00&euro;</div>
        </a>
        <a class="tx-row" href="money-management.html" data-od-id="tx2-row-groceries">
          <div class="tx-ill"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M4 4h2l2 10h9l2-7H8"/><circle cx="9" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg></div>
          <div class="tx-col"><div class="tx-cat">Groceries</div><div class="tx-desc">Weekly supermarket run</div><div class="tx-date">12 Apr</div></div>
          <div class="tx-amt">-48.20&euro;</div>
        </a>
        <a class="tx-row" href="money-management.html" data-od-id="tx2-row-coffee">
          <div class="tx-ill"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M16 10h2a2.5 2.5 0 0 1 0 5h-2"/></svg></div>
          <div class="tx-col"><div class="tx-cat">Food</div><div class="tx-desc">Caf&eacute; coffee</div><div class="tx-date">11 Apr</div></div>
          <div class="tx-amt">-4.50&euro;</div>
        </a>
        <a class="tx-row" href="money-management.html" data-od-id="tx2-row-transport">
          <div class="tx-ill"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M4 16l1.5-5h13L20 16"/><rect x="4" y="16" width="16" height="4" rx="1.5"/><circle cx="8" cy="20" r="1.4"/><circle cx="16" cy="20" r="1.4"/></svg></div>
          <div class="tx-col"><div class="tx-cat">Transport</div><div class="tx-desc">Train ticket</div><div class="tx-date">09 Apr</div></div>
          <div class="tx-amt">-12.80&euro;</div>
        </a>
        <a class="tx-row" href="money-management.html" data-od-id="tx2-row-rent">
          <div class="tx-ill"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg></div>
          <div class="tx-col"><div class="tx-cat">Housing</div><div class="tx-desc">Apartment rent</div><div class="tx-date">01 Apr</div></div>
          <div class="tx-amt">-890.00&euro;</div>
        </a>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-od-id="tabbar">
    <div class="tabs-side">
      <a class="tab" href="dashboard.html" data-od-id="tab-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="tab active" href="money-management.html" data-od-id="tab-money">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10.5v3M18 10.5v3"/></svg>
        <span>Money</span>
      </a>
    </div>
    <div class="fab-slot"></div>
    <div class="tabs-side">
      <a class="tab" href="time-management.html" data-od-id="tab-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Time</span>
      </a>
    </div>
    <a class="fab" href="money-management-3.html" aria-label="Add" data-od-id="fab">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 0V20M0 10H20" stroke="#fff" stroke-width="3"/></svg>
    </a>
  </nav>
</div>
</body>
</html>
