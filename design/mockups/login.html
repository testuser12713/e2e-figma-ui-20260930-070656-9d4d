<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>businesshandler — Login</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-wrap { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  .login-inner { display: flex; flex-direction: column; align-items: center; padding: 0 39px; }
  .brand { margin-top: 46px; display: flex; flex-direction: column; align-items: center; }
  .welcome { margin-top: 28px; font-family: var(--font-family); font-weight: 700; font-size: 40px; line-height: 51px; color: var(--color-fg); }
  .sub { margin-top: 6px; font-family: var(--font-family-body); font-weight: 400; font-size: 14px; line-height: 17px; color: var(--color-muted); }
  .form { margin-top: 34px; display: flex; flex-direction: column; align-items: center; }
  .input-login + .input-login { margin-top: 36px; }
  .forgot { margin-top: 18px; font-family: var(--font-family-body); font-weight: 400; font-size: 13px; line-height: 17px; color: var(--color-muted-2); }
  .btn-dark { margin-top: 22px; }
  .signup { margin-top: 22px; font-family: var(--font-family); font-weight: 700; font-size: 13px; line-height: 17px; color: var(--color-muted-3); }
  .socials { margin-top: 30px; display: flex; gap: 20px; }
  .steps { margin-top: 46px; font-family: var(--font-family-body); font-weight: 400; font-size: 16px; line-height: 20px; color: #0000008A; }
</style>
</head>
<body>
<div class="screen" data-od-id="login-screen">
  <div class="login-wrap">
    <div class="login-inner">
      <div class="brand" data-od-id="login-brand">
        <div class="brand-mark">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h18"/><path d="M7 14h6"/></svg>
        </div>
        <div class="welcome" data-od-id="login-welcome">Welcome</div>
        <div class="sub">Sign in to manage your business</div>
      </div>

      <form class="form" onsubmit="location.href='dashboard.html'; return false;">
        <div class="input-login" data-od-id="login-email-field">
          <input type="email" placeholder="Email" aria-label="Email">
          <span class="trailing">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
          </span>
        </div>
        <div class="input-login" data-od-id="login-password-field">
          <input type="password" value="***********" aria-label="Password">
          <span class="trailing">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#23233C" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </span>
        </div>
        <a class="forgot" href="#" data-od-id="login-forgot">Forgot you password?</a>
        <a class="btn-dark" href="dashboard.html" data-od-id="login-submit">Login</a>
        <a class="signup" href="onboarding-1.html" data-od-id="login-signup">Don&rsquo;t have an account? sign up</a>
      </form>

      <div class="socials" data-od-id="login-social">
        <a class="btn-social" href="dashboard.html" aria-label="Continue with Facebook">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0F279E"><path d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.3-1.5 1.6-1.5h1.3V5c-.2 0-1-.1-1.9-.1-1.9 0-3.2 1.2-3.2 3.3V11H9v3h2.3v7h2.2Z"/></svg>
        </a>
        <a class="btn-social" href="dashboard.html" aria-label="Continue with Google">
          <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6Z"/></svg>
        </a>
      </div>

      <div class="steps" data-od-id="login-steps">1/1 steps</div>
    </div>
  </div>
</div>
</body>
</html>
